<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030407">
<title>LUXEN CLIENT - Reseller Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue: #1E88E5;
  --blue-lite: #42A5F5;
  --blue-dark: #1565C0;
  --bg: #030407;
  --card-bg: #0A0D14;
  --border: rgba(30, 136, 229, 0.35);
  --muted: #90A4AE; 
  --text: #FFFFFF;
  --success: #00E676; 
  --error: #FF1744; 
  --warning: #FF9800;
  --neon-glow: 0 0 20px rgba(30, 136, 229, 0.5), inset 0 0 10px rgba(30, 136, 229, 0.2);
  --neon-card-glow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 15px rgba(30, 136, 229, 0.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Cairo',sans-serif;}
html,body{height:100%;}
body{background:radial-gradient(circle at center, #0b1936 0%, var(--bg) 100%);color:var(--text);display:flex;justify-content:center;align-items:center;min-height:100dvh;overflow-x:hidden;position:relative;}
body::before {
  content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(30, 136, 229, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(30, 136, 229, 0.05) 1px, transparent 1px);
  background-size: 35px 35px; pointer-events: none; z-index: 0;
}
.app-container{position:relative;z-index:1;width:100%;max-width:420px;height:100dvh;padding:18px;display:flex;flex-direction:column;justify-content:space-between;}
.view{display:none;flex-direction:column;height:100%;min-height:0;}
.view.active{display:flex;}
.top-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:0.8rem;font-weight:700;color:var(--success);text-shadow:0 0 8px var(--success);}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 12px var(--success);}
.logout-btn{background:rgba(255, 23, 68, 0.15);border:1px solid rgba(255, 23, 68, 0.4);color:var(--error);padding:6px 14px;border-radius:10px;font-size:0.78rem;font-weight:800;cursor:pointer;transition:0.3s;}
.logout-btn:hover{background:rgba(255, 23, 68, 0.3);box-shadow:0 0 15px rgba(255,23,68,0.5);}
.brand{text-align:center;user-select:none;margin-bottom:25px;}
.logo-title{font-family:'Orbitron',sans-serif;font-weight:900;line-height:1.1;text-transform:uppercase;}
.logo-title .l1{display:block;font-size:2.2rem;letter-spacing:4px;color:#FFFFFF;text-shadow:0 0 20px rgba(255,255,255,0.4);}
.logo-title .l2{display:block;font-size:1.8rem;letter-spacing:5px;color:var(--blue-lite);text-shadow:0 0 25px rgba(30, 136, 229, 0.8);margin-top:4px;}
.brand-sub{font-size:0.82rem;color:var(--muted);margin-top:8px;font-weight:700;letter-spacing:1px;}
.form-section{width:100%;margin:auto 0;}
.input-label{display:flex;align-items:center;gap:6px;font-size:0.82rem;font-weight:700;color:var(--blue-lite);margin-bottom:8px;text-align:inherit;}
.cyber-input-wrapper{position:relative;background:var(--card-bg);border:1px solid var(--border);display:flex;align-items:center;padding:8px;margin-bottom:16px;border-radius:14px;box-shadow:inset 0 0 12px rgba(0,0,0,0.9);}
.input-field{width:100%;background:transparent;border:none;outline:none;color:#fff;font-family:'Orbitron',sans-serif;font-size:0.95rem;padding:12px;text-align:center;letter-spacing:1px;}
select.input-field { font-family: 'Cairo', sans-serif; }
.btn-primary{width:100%;padding:16px;background:linear-gradient(135deg, var(--blue-dark), var(--blue));border:1px solid var(--blue-lite);color:#fff;font-size:1.05rem;font-weight:900;cursor:pointer;border-radius:14px;box-shadow:var(--neon-glow);text-transform:uppercase;letter-spacing:2px;transition:0.3s;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(30,136,229,0.9);}
.btn-danger{background:linear-gradient(135deg, #FF1744, #B71C1C);border-color:var(--error);box-shadow:0 0 15px rgba(255,23,68,0.5);}
.cyber-card{background:var(--card-bg);border:1px solid var(--border);padding:14px 16px;margin-bottom:12px;border-radius:14px;box-shadow:var(--neon-card-glow);}
.key-title-sm{font-size:0.75rem;color:var(--muted);font-weight:800;margin-bottom:4px;}
.key-value-txt{font-family:'Orbitron',sans-serif;font-weight:800;font-size:0.82rem;color:var(--blue-lite);}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg, #0A0D14, #141A29);color:#fff;padding:10px 22px;border-radius:30px;font-size:0.78rem;font-weight:800;border:1px solid var(--blue-lite);transition:all 0.3s;z-index:99;opacity:0;box-shadow:0 0 25px rgba(30,136,229,0.5);}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.error-msg{color:var(--error);font-size:0.8rem;margin-top:10px;display:none;text-align:center;font-weight:800;}
.error-msg.show{display:block;}
.hidden{display:none!important;}

/* شاشة صيانة الموزعين */
#maintenanceScreen {
  position: fixed; inset: 0; background: radial-gradient(circle at center, #1a0f00 0%, var(--bg) 100%);
  z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; text-align: center;
}
</style>
</head>
<body>

<!-- شاشة صيانة الموزعين (تظهر تلقائياً عند تفعيلها من لوحة الأدمن) -->
<div id="maintenanceScreen" class="hidden">
  <div style="font-size:4.5rem; margin-bottom:20px;">🛠️</div>
  <h1 style="font-family:'Orbitron'; font-size:1.8rem; color:var(--warning); margin-bottom:10px;">RESELLER MAINTENANCE</h1>
  <p style="color:var(--muted); font-size:0.9rem; max-width:320px; line-height:1.6; font-weight:700;">بوابة الموزعين متوقفة حالياً للصيانة والتحديثات الدورية.</p>
</div>

<div class="app-container" id="appMainBox">
  
  <!-- ================= 1. شاشة تسجيل دخول الموزع ================= -->
  <section id="loginView" class="view active">
    <div class="top-header">
      <div style="font-size:0.75rem; color:var(--muted); font-weight:800; font-family:'Orbitron';">RESELLER PORTAL</div>
    </div>
    <div class="form-section">
      <div class="brand">
        <div class="logo-title">
          <span class="l1">LUXEN</span>
          <span class="l2">RESELLER</span>
        </div>
        <div class="brand-sub">بوابة الموزعين المعتمدين</div>
      </div>
      <div class="input-label">كود الموزع الخاص بك</div>
      <div class="cyber-input-wrapper">
        <input type="text" id="resellerCodeInput" class="input-field" placeholder="ENTER RESELLER CODE">
      </div>
      <div id="errorMsg" class="error-msg"></div>
      <button class="btn-primary" onclick="loginReseller()">دخول الموزع ➔</button>
    </div>
  </section>

  <!-- ================= 2. لوحة تحكم الموزع ================= -->
  <section id="panelView" class="view">
    <div class="top-header">
      <div class="status-pill"><span class="status-dot"></span><span id="displayResellerName">--</span></div>
      <button class="logout-btn" onclick="logout()">خروج ➔</button>
    </div>

    <div style="flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-top:4px;">
      
      <!-- إحصائيات الرصيد -->
      <div class="cyber-card" style="text-align:center; padding:16px;">
        <div class="key-title-sm">رصيدك الحالي في النظام</div>
        <div id="displayBal" style="font-family:'Orbitron'; font-size:1.8rem; color:var(--success); font-weight:900; text-shadow:0 0 12px rgba(0,230,118,0.4);">0.00</div>
      </div>

      <!-- توليد مفتاح جديد -->
      <div class="cyber-card">
        <div class="key-title-sm" style="margin-bottom:8px;">⚡ توليد مفتاح جديد</div>
        <div style="font-size:0.7rem; color:var(--blue-lite); font-weight:700; margin-bottom:4px;">مدة المفتاح</div>
        <select id="keyDurationSelect" class="input-field" style="margin-bottom:10px;">
          <option value="86400000">24 Hours (1 Day)</option>
          <option value="604800000">7 Days</option>
          <option value="2592000000" selected>30 Days</option>
        </select>
        
        <div style="font-size:0.7rem; color:var(--blue-lite); font-weight:700; margin-bottom:4px;">عدد الأجهزة المسموحة</div>
        <select id="keyMaxDevicesSelect" class="input-field" style="margin-bottom:12px;">
          <option value="1" selected>📱 جهاز 1 فقط</option>
          <option value="2">📱📱 جهازين</option>
          <option value="3">📱📱📱 3 أجهزة</option>
        </select>

        <button class="btn-primary" onclick="generateKey()">🔥 توليد المفتاح الآن</button>
      </div>

      <!-- مفاتيح الموزع -->
      <div class="cyber-card">
        <div class="key-title-sm" style="margin-bottom:8px;">🔑 المفاتيح التي قمت بتوليدها</div>
        <div id="keysList" style="max-height:180px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;">
          <div style="text-align:center; color:var(--muted); font-size:0.75rem;">لا توجد مفاتيح حتى الآن</div>
        </div>
      </div>

    </div>
  </section>

</div>

<div id="toast" class="toast"></div>

<script>
const WEB_API_KEY = 'AIzaSyAzQJuIPLwJsTJ1veR3f4trvfZoGhprduA';
const FIREBASE_URL = 'https://luxen-pro-default-rtdb.firebaseio.com/';
let activeReseller = null;

window.addEventListener('DOMContentLoaded', async () => {
  // فحص حالة صيانة بوابة الموزعين من Firebase عند التحميل
  try {
    const res = await fetch(`${FIREBASE_URL}settings/maintenance.json`);
    const data = await res.json();
    if (data && data.reseller === true) {
      document.getElementById('maintenanceScreen').classList.remove('hidden');
      document.getElementById('appMainBox').classList.add('hidden');
      return;
    }
  } catch(e) {}
});

async function getAuthToken() {
  try {
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${WEB_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ returnSecureToken: true })
    });
    const d = await res.json();
    return d.idToken;
  } catch (e) { return null; }
}

async function loginReseller() {
  let code = document.getElementById('resellerCodeInput').value.trim().replace(/\s+/g, '_');
  if(!code) { showError("يرجى إدخال كود الموزع"); return; }

  showToast("⏳ جاري التحقق من السيرفر...");

  try {
    let token = await getAuthToken();
    let res = await fetch(`${FIREBASE_URL}resellers/${code}.json?auth=${token}`);
    let data = await res.json();

    if(data === null) {
      showError("كود الموزع غير موجود في النظام!");
      return;
    }

    activeReseller = code;
    document.getElementById('loginView').classList.remove('active');
    document.getElementById('panelView').classList.add('active');
    document.getElementById('displayResellerName').innerText = code;
    loadResellerData(token);
  } catch(e) {
    showError("خطأ في الاتصال بقاعدة البيانات");
  }
}

async function loadResellerData(token) {
  if(!token) token = await getAuthToken();
  try {
    let res = await fetch(`${FIREBASE_URL}resellers/${activeReseller}.json?auth=${token}`);
    let data = await res.json();
    
    let bal = (data && data.balance !== undefined) ? parseFloat(data.balance) : 0;
    document.getElementById('displayBal').innerText = bal.toFixed(2);
    
    let list = document.getElementById('keysList');
    list.innerHTML = '';
    
    if(data && data.my_keys && Object.keys(data.my_keys).length > 0) {
      for(let k in data.my_keys) {
        list.innerHTML += `
          <div style="background:#030407; padding:10px; border-radius:8px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
            <span class="key-value-txt">${k}</span>
            <button onclick="copyKeyText('${k}')" style="background:rgba(30,136,229,0.2); border:1px solid var(--border); color:#fff; padding:4px 10px; border-radius:6px; font-size:0.7rem; cursor:pointer; font-weight:800;">نسخ</button>
          </div>`;
      }
    } else {
      list.innerHTML = '<div style="text-align:center; color:var(--muted); font-size:0.75rem;">لا توجد مفاتيح حتى الآن</div>';
    }
  } catch(e) {}
}

async function generateKey() {
  let durationMs = Number(document.getElementById('keyDurationSelect').value);
  let devicesAllowed = document.getElementById('keyMaxDevicesSelect').value;
  let unitPrice = 1.00; // سعر المفتاح الواحد

  try {
    let token = await getAuthToken();
    let res = await fetch(`${FIREBASE_URL}resellers/${activeReseller}/balance.json?auth=${token}`);
    let bal = parseFloat(await res.json()) || 0;

    if(bal < unitPrice) {
      showToast("❌ رصيدك غير كافٍ لتوليد مفتاح!");
      return;
    }

    showToast("⏳ جاري توليد المفتاح...");

    // خصم الرصيد
    let newBal = bal - unitPrice;
    await fetch(`${FIREBASE_URL}resellers/${activeReseller}/balance.json?auth=${token}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(newBal)
    });

    // توليد صيغة المفتاح المطلوبة LUXEN_XXXX_XXX_XXX
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let p1='', p2='', p3='';
    for(let j=0; j<4; j++) p1 += chars.charAt(Math.floor(Math.random() * chars.length));
    for(let j=0; j<3; j++) p2 += chars.charAt(Math.floor(Math.random() * chars.length));
    for(let j=0; j<3; j++) p3 += chars.charAt(Math.floor(Math.random() * chars.length));
    let newKey = `LUXEN_${p1}_${p2}_${p3}`;
    let now = Date.now();

    // حفظ المفتاح في جدول النظام الرئيسي keys
    await fetch(`${FIREBASE_URL}keys/${newKey}.json?auth=${token}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ 
        active: true, 
        durationMs, 
        devicesAllowed, 
        created: now, 
        reseller: activeReseller 
      })
    });

    // حفظ المفتاح في قائمة مفاتيح الموزع الخاصة my_keys
    await fetch(`${FIREBASE_URL}resellers/${activeReseller}/my_keys/${newKey}.json?auth=${token}`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ created: now })
    });

    showToast("✅ تم توليد المفتاح بنجاح!");
    loadResellerData(token);
  } catch(e) {
    showToast("❌ حدث خطأ أثناء التوليد");
  }
}

function copyKeyText(key) {
  navigator.clipboard.writeText(key);
  showToast("✔ تم نسخ المفتاح بنجاح");
}

function showError(msg) {
  let el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 4000);
}

function showToast(msg) {
  let t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function logout() {
  activeReseller = null;
  document.getElementById('panelView').classList.remove('active');
  document.getElementById('loginView').classList.add('active');
  document.getElementById('resellerCodeInput').value = '';
}
</script>
</body>
</html>
