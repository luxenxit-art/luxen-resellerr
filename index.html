<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXEN CLIENT - Secure Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root {
--bg-dark: #030407; --card-bg: #0A0D14; --card-border: rgba(30, 136, 229, 0.25);
--accent-blue: #1E88E5; --accent-glow: #42A5F5; --text-white: #ffffff;
--text-muted: #78909C; --danger-red: #FF1744; --success-green: #00E676;
}
* { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
body { background: var(--bg-dark); color: var(--text-white); min-height: 100vh; padding: 20px 15px; display: flex; justify-content: center; align-items: flex-start; }
.dashboard-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }
.input-field { width: 100%; background: #030407; border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; color: #fff; text-align: center; outline: none; }
.btn-submit { width: 100%; background: linear-gradient(135deg, #1565C0, #1E88E5); border: none; border-radius: 12px; color: #fff; padding: 14px; font-weight: 800; cursor: pointer; }
.hidden { display: none !important; }
.auth-container-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 85vh; text-align: center; width: 100%; }
.msg-box { font-size: 0.8rem; text-align: center; min-height: 18px; margin-top: 4px; font-weight: 700; }
</style>
</head>
<body>

<div class="dashboard-container">
<!-- تسجيل دخول الأدمن المعتمد على التوثيق الآمن -->
<div id="adminLoginView" class="auth-container-center">
<div style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px;">
<div style="font-size: 0.9rem; color: var(--accent-glow); font-weight: bold;">🔒 بوابة الأدمن المحمية</div>
<input type="password" id="adminInputPass" class="input-field" placeholder="أدخل كلمة مرور الأدمن الآمنة">
<button class="btn-submit" onclick="loginAsAdmin()">دخول للإدارة</button>
</div>
</div>

<!-- لوحة الأدمن -->
<div id="adminPanel" class="hidden" style="width:100%;">
<h2>أهلاً بك يا أدمن، النظام مؤمن بالكامل.</h2>
<button class="btn-submit" onclick="logout()" style="background:var(--danger-red); margin-top:20px;">تسجيل خروج</button>
</div>

<div id="msg" class="msg-box"></div>
</div>

<script>
const WEB_API_KEY = 'AIzaSyAzQJuIPLwJsTJ1veR3f4trvfZoGhprduA';
const FIREBASE_URL = 'https://luxen-pro-default-rtdb.firebaseio.com/';

function showMsg(txt, color) {
  const msg = document.getElementById('msg');
  msg.style.color = color;
  msg.innerHTML = txt;
  setTimeout(() => { msg.innerHTML = ''; }, 4000);
}

async function getAuthToken() {
  try {
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${WEB_API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ returnSecureToken: true })
    });
    const data = await res.json();
    return data.idToken;
  } catch (e) { return null; }
}

async function loginAsAdmin() {
  let pass = document.getElementById('adminInputPass').value.trim();
  if (!pass) { showMsg('⚠ أدخل كلمة المرور', 'var(--danger-red)'); return; }

  try {
    const token = await getAuthToken();
    // جلب كلمة المرور المشفرة أو المخزنة بأمان
    const res = await fetch(`${FIREBASE_URL}settings/admin_pass.json?auth=${token}`);
    let adminPass = await res.json();
    
    // القيمة الافتراضية إذا لم تحددها مسبقاً
    if (!adminPass) adminPass = "Dhia";

    if (pass === adminPass) {
      document.getElementById('adminLoginView').classList.add('hidden');
      document.getElementById('adminPanel').classList.remove('hidden');
      showMsg('✅ تم تسجيل الدخول بنجاح', 'var(--success-green)');
    } else {
      showMsg('❌ كلمة المرور غير صحيحة!', 'var(--danger-red)');
    }
  } catch (e) {
    showError('❌ خطأ في الاتصال بالخادم الآمن');
  }
}

function logout() {
  location.reload();
}
</script>

</body>
</html>
